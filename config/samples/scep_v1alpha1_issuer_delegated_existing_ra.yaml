apiVersion: v1
kind: Secret
metadata:
  name: scep-challenge-secret-exra
type: Opaque
stringData:
  password: "SecretChallenge"
---
# Note: The RA Agent certificate used for delegation must be signed and issued by the SCEP Certificate Authority.
apiVersion: v1
kind: Secret
metadata:
  name: existing-delegating-tls
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: scep.hshade.io/v1alpha1
kind: Issuer
metadata:
  name: delegated-scep-issuer-exra
spec:
  url: http://192.168.1.34/scep/generic
  enrollmentMode: Delegated
  insecureSkipVerify: true
  challengeSecretRef:
    name: scep-challenge-secret-exra
    key: password
  delegatedSignerSecretName: existing-delegating-tls
