apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "scep-issuer.fullname" . }}-manager
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests/status"]
    verbs: ["patch"]
  - apiGroups: ["scep.hshade.io"]
    resources: ["issuers", "clusterissuers"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["scep.hshade.io"]
    resources: ["issuers/status", "clusterissuers/status"]
    verbs: ["patch"]
  # Secrets are read through the manager's cached client (needs get/list/watch).
  # create/update manage the RA signer secret, delete removes the pending-enrollment secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/status"]
    verbs: ["patch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames:
      - clusterissuers.scep.hshade.io/*
      - issuers.scep.hshade.io/*
    verbs: ["sign"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "scep-issuer.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "scep-issuer.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "scep-issuer.fullname" . }}-manager
  apiGroup: rbac.authorization.k8s.io

{{- if .Values.approver.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "scep-issuer.fullname" . }}-approve
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["signers"]
    resourceNames:
      - issuers.scep.hshade.io/*
      - clusterissuers.scep.hshade.io/*
    verbs: ["approve"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "scep-issuer.fullname" . }}-approve
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "scep-issuer.fullname" . }}-approve
subjects:
  - kind: ServiceAccount
    name: {{ .Values.approver.certManagerServiceAccount }}
    namespace: {{ .Values.clusterResourceNamespace }}
{{- end }}